<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doação de sangue</title>
</head>
<body>
    <form action="" onsubmit="verificar(event)">
        <!-- input da data de nascimento -->
        <p>
            <label for="nascimento">Qual sua data de nascimento?
            </label>
            <input type="date" name="nascimento" id="nascimento"required>
        </p>
        <!-- Entrada - Possui alguma doença? -->
        <p>
            <label for=""> Possui alguma doença?
            </label>
                <input type="radio" name="sick" id="inputYesSick" value="Yes"required>
                <label for="inputYesSick">Yes</label>
                <input type="radio" name="sick" id="inputNoSick" value="No"required>
                <label for="inputNoSick">No</label>
            </p>
            <!-- Entrada - Peso atual -->
            <p>
                <label for="peso">Peso atual</label>
                <input type="number" name="" id="peso"required>
        
            </p>
            <!-- Entrada - Possui tatuagem recente? -->
            <p>
                <label for="">Possui tatuagem recente?</label>
                <input type="radio" name="Tattoo" id="inputYesTattoo" value="yes" required>
                <label for="inputYesTattoo">Yes</label>
                <input type="radio" name="Tattoo" id="inputNoTattoo" value="No" required>
                <label for="inputNoTattoo">No</label>
            </p>
            <!-- Entrada - Medicação -->
            <p>
                <label for=""> Está tomando algum medicamento?</label>
                <input type="radio" name="medicine" id="inputYesMedicine" value="Yes" required>
                <label for="inputYesMedicine">Yes</label>
                <input type="radio" name="medicine" id="inputNoMedicine" value="No" required>
                <label for="inputNoMedicine">No</label>
            </p>
            <input type="submit" value="Verificar">
    </form>

        

        <p id="resultado"></p>
        
    <!-- ctrl + shift + p =  escrevendo wrap e colocar abreviação que você quer que tenha destacado -->
    <script src="script.js"></script>
</body>
</html>
